name: Android CI

on:
  push:
    branches: [main, "release/**"]
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["apps/android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify compile classpath
        run: ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: Build debug APK
        env:
          # Clé publishable Clerk = config publique client (pas de secret).
          # Utilise le secret repository s'il existe, sinon la clé canonique KIMBA 2026.
          POUFA_CLERK_PUBLISHABLE_KEY: ${{ secrets.POUFA_CLERK_PUBLISHABLE_KEY || 'pk_test_aW50ZXJuYWwtb3lzdGVyLTgzNjEuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          POUFA_API_BASE_URL: ${{ vars.POUFA_API_BASE_URL || 'https://fastapi-poufa-production.up.railway.app/' }}
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poufa-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
